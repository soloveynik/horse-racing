services:
  nginx:
    image: nginx:1.25
    container_name: horse_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - backend

  app1:
    build: .
    container_name: horse_app1
    environment:
      - DB_HOST=db
      - DB_NAME=horse_racing
      - DB_USER=appuser
      - DB_PASSWORD=StrongPassword123
      - INSTANCE_ID=app1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    # Порты наружу НЕ пробрасываем (пункт 2)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  app2:
    build: .
    container_name: horse_app2
    environment:
      - DB_HOST=db
      - DB_NAME=horse_racing
      - DB_USER=appuser
      - DB_PASSWORD=StrongPassword123
      - INSTANCE_ID=app2
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  db:
    image: mariadb:10.11
    container_name: horse_db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=horse_racing
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=StrongPassword123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  backend:
    driver: bridge
