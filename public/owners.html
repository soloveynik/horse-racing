<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Владельцы — Скачки</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🐎 Скачки
    </div>

    <div class="user-info">

        <span id="username"></span>

        <button id="backButton">
            Главная
        </button>

        <button id="logoutButton">
            Выйти
        </button>

    </div>

</header>


<main class="container">

    <h1>Владельцы</h1>

    <button id="showFormButton">
        + Добавить владельца
    </button>


    <div id="ownerFormContainer" style="display: none;">

        <h2>Добавление владельца</h2>

        <form id="ownerForm">

            <input
                type="text"
                id="name"
                placeholder="Имя владельца"
                required
            >

            <input
                type="text"
                id="contact"
                placeholder="Контактная информация"
            >

            <button type="submit">
                Сохранить
            </button>

            <button
                type="button"
                id="cancelButton"
            >
                Отмена
            </button>

        </form>

        <p id="formMessage"></p>

    </div>


    <h2>Список владельцев</h2>

    <div id="ownersContainer">
        Загрузка...
    </div>

</main>


<script>

async function checkAuth() {

    const response = await fetch(
        '../api/auth.php?action=me'
    );

    const result = await response.json();

    if (!result.success) {

        window.location.href = 'login.html';

        return;
    }

    document.getElementById('username').textContent =
        result.user.username;
}


async function loadOwners() {

    const response = await fetch(
        '../api/owners.php'
    );

    const result = await response.json();

    const container =
        document.getElementById('ownersContainer');


    if (!result.success) {

        container.textContent =
            'Не удалось загрузить список владельцев';

        return;
    }


    if (result.data.length === 0) {

        container.innerHTML =
            '<p>Владельцы пока не добавлены.</p>';

        return;
    }


    let html = `
        <table border="1" cellpadding="10">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Имя</th>

                    <th>Контакт</th>

                    <th>Действия</th>

                </tr>

            </thead>

            <tbody>
    `;


    result.data.forEach(owner => {

        html += `

            <tr>

                <td>${owner.id}</td>

                <td>${owner.name}</td>

                <td>${owner.contact ?? ''}</td>

                <td>

                    <button
                        onclick="editOwner(${owner.id})"
                    >
                        Изменить
                    </button>

                    <button
                        onclick="deleteOwner(${owner.id})"
                    >
                        Удалить
                    </button>

                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML = html;
}


document
    .getElementById('showFormButton')
    .addEventListener('click', function() {

        document
            .getElementById('ownerFormContainer')
            .style.display = 'block';

    });


document
    .getElementById('cancelButton')
    .addEventListener('click', function() {

        document
            .getElementById('ownerFormContainer')
            .style.display = 'none';

    });


document
    .getElementById('ownerForm')
    .addEventListener('submit', async function(event) {

        event.preventDefault();


        const data = {

            name:
                document.getElementById('name').value,

            contact:
                document.getElementById('contact').value

        };


        const response = await fetch(
            '../api/owners.php',
            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify(data)
            }
        );


        const result =
            await response.json();


        const message =
            document.getElementById('formMessage');


        if (result.success) {

            message.textContent =
                'Владелец успешно добавлен';

            document
                .getElementById('ownerForm')
                .reset();

            document
                .getElementById('ownerFormContainer')
                .style.display = 'none';

            loadOwners();

        } else {

            message.textContent =
                result.message ||
                'Ошибка добавления';

        }

    });


async function editOwner(id) {

    const name = prompt(
        'Введите новое имя владельца:'
    );

    if (!name) {
        return;
    }


    const contact = prompt(
        'Введите контактную информацию:'
    );


    const response = await fetch(
        `../api/owners.php?id=${id}`,
        {
            method: 'PUT',

            headers: {
                'Content-Type':
                    'application/json'
            },

            body: JSON.stringify({
                name: name,
                contact: contact
            })
        }
    );


    const result =
        await response.json();


    alert(result.message);


    if (result.success) {
        loadOwners();
    }
}


async function deleteOwner(id) {

    const confirmed = confirm(
        'Вы действительно хотите удалить владельца?'
    );


    if (!confirmed) {
        return;
    }


    const response = await fetch(
        `../api/owners.php?id=${id}`,
        {
            method: 'DELETE'
        }
    );


    const result =
        await response.json();


    alert(result.message);


    if (result.success) {
        loadOwners();
    }
}


document
    .getElementById('backButton')
    .addEventListener('click', function() {

        window.location.href = 'index.php';

    });


document
    .getElementById('logoutButton')
    .addEventListener('click', async function() {

        await fetch(
            '../api/auth.php?action=logout',
            {
                method: 'POST'
            }
        );

        window.location.href = 'login.html';

    });


checkAuth();

loadOwners();

</script>

</body>

</html>
